name: Docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

# A newer push to the same branch/PR cancels the build still running for the
# previous commit.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: reading the repository is all most steps need.
# The job that publishes asks for packages:write explicitly below.
permissions:
  contents: read

jobs:
  build:
    name: Build image${{ github.event_name != 'pull_request' && ' & publish to GHCR' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read     # checkout the sources
      packages: write    # push the image to ghcr.io (no-op on pull requests, nothing is pushed)
    outputs:
      image: ${{ steps.published.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # GHCR image names must be lowercase; the repository name is not.
      - name: Compute image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The workflow's own short-lived GITHUB_TOKEN authenticates the push.
      # No personal access token is stored anywhere.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags:   latest (main and releases), sha-<short commit>, 1.2.3 and 1.2
      #         on a v1.2.3 tag, pr-<n> on pull requests (never pushed).
      # Labels: org.opencontainers.image.{source,revision,created,version,...}
      #         so anyone inspecting the image can trace it back to the
      #         repository, the commit and the build time.
      - name: Image metadata (tags and OCI labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        env:
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          set -euo pipefail
          echo "Testing $IMAGE"

          uid="$(docker run --rm --entrypoint id "$IMAGE" -u)"
          test "$uid" = "1000" || { echo "container runs as uid $uid, expected the non-root 'node' user"; exit 1; }

          docker run -d --name smoke -p 3000:3000 "$IMAGE"
          for _ in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health; then echo; ok=1; break; fi
            sleep 1
          done
          if [ "${ok:-0}" != 1 ]; then
            echo "::error::/health did not answer within 15 s"
            docker logs smoke
            exit 1
          fi
          docker rm -f smoke >/dev/null

      # Same build (served from the cache), this time exported to the registry.
      - name: Push image to GHCR
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Publish the image reference
        if: github.event_name != 'pull_request'
        id: published
        run: |
          echo "image=${IMAGE_NAME}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
          {
            echo "### Published image"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "${IMAGE_NAME}@${{ steps.push.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Deployment simulation: pull the image that was just published, exactly as
  # a server would, start it and wait for Docker's own HEALTHCHECK to report
  # healthy.
  verify-published:
    name: Pull & run the published image
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull, start and wait for healthy
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run -d --name api -p 3000:3000 "$IMAGE"

          for attempt in $(seq 1 60); do
            status="$(docker inspect --format '{{.State.Health.Status}}' api)"
            echo "attempt $attempt: $status"
            [ "$status" = "healthy" ] && break
            sleep 2
          done
          [ "$status" = "healthy" ] || { docker logs api; exit 1; }

          curl -fsS http://localhost:3000/tasks | head -c 200; echo
          docker rm -f api >/dev/null

      - name: Show image provenance labels
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: docker inspect --format '{{json .Config.Labels}}' "$IMAGE" | python3 -m json.tool
