name: Scheduled security scan

# Vulnerabilities are published every day; an image that scanned clean on
# merge day may not be clean a week later. This workflow re-scans the
# published image and audits the npm dependencies every Monday, and can be
# triggered by hand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Re-scan the published image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read          # pull the published image
      security-events: write  # upload the report to the Security tab
    steps:
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan published image with Trivy (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          ignore-unfixed: true
          format: sarif
          output: trivy-scheduled.sarif

      - name: Upload scan report to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-scheduled.sarif
          category: trivy-image-scheduled

      # Same policy as the publishing workflow. A failure here means the
      # image currently tagged 'latest' carries a fixable CRITICAL/HIGH
      # vulnerability: open a 'security' issue and ship a rebuilt image.
      - name: Scan published image with Trivy (gate on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  dependencies:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (fail on high or critical)
        run: npm audit --audit-level=high
